[package]
name = "ghosttweak"
version = "1.0.0"
description = "Fast Tweak & Cleaner for gamers"
authors = ["GhostTweak"]
edition = "2021"

[lib]
name = "ghosttweak_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
dirs = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
panic = "unwind"
opt-level = 3
lto = true
codegen-units = 1
strip = false
