[package]
name = "ghosttweak"
version = "1.0.0"
description = "Fast Tweak & Cleaner for gamers"
authors = ["GhostTweak"]
edition = "2021"

[lib]
name = "ghosttweak_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
trial = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
dirs = "5"
sha2 = "0.11.0"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast"] }
hex = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
panic = "unwind"
opt-level = 3
lto = false
codegen-units = 16
strip = false
