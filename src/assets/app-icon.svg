<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#161626"/>
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#6366f1" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Ghost Body with Glow -->
  <g filter="url(#glow)">
    <path d="M 256 96 
             C 170 96, 136 160, 136 240 
             L 136 380 
             L 172 344 
             L 214 380 
             L 256 344 
             L 298 380 
             L 340 344 
             L 376 380 
             L 376 240 
             C 376 160, 342 96, 256 96 Z" 
          fill="url(#ghostGrad)"/>

    <!-- Glowing Cyber Eyes -->
    <ellipse cx="206" cy="220" rx="22" ry="28" fill="#06b6d4"/>
    <ellipse cx="306" cy="220" rx="22" ry="28" fill="#06b6d4"/>
    <circle cx="212" cy="214" r="8" fill="#ffffff"/>
    <circle cx="312" cy="214" r="8" fill="#ffffff"/>

    <!-- Lightning / Speed tweak accent -->
    <path d="M 246 270 L 268 270 L 250 306 L 274 306 L 238 348 L 248 316 L 232 316 Z" 
          fill="#38bdf8"/>
  </g>
</svg>
